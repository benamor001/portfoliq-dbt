version: 2

# =============================================================================
# portfoliq — fact model documentation + tests
#
# All tests default to severity 'warn' via dbt_project.yml. Host projects can
# override to 'error' by adding to their own dbt_project.yml:
#   tests:
#     portfoliq:
#       +severity: error
# =============================================================================

models:

  # ── fact_macro_observations_unified ────────────────────────────────────────
  - name: fact_macro_observations_unified
    description: >
      Unified cross-provider macro observations view. Single BI query surface for
      11 macro data providers (FRED, ECB, BoJ, BoK, HKMA, OECD, IMF, Eurostat, BIS,
      US Treasury, World Bank). Each provider satellite is filtered to its active
      SCD2 row (load_end_ts IS NULL).
      OECD/IMF/Eurostat/BIS observation_period strings ('2024-Q3', '2024-11', '2024')
      are normalized to DATE = first day of period.
      Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        ai_generated: false
        disclaimer: "Not financial advice. Methodology disclosed."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [provider, series_id, observation_date]
    columns:
      - name: provider
        description: "Source provider code (UPPERCASE). FK to dim_data_provider.provider_code."
        tests:
          - not_null
          - accepted_values:
              values: [FRED, ECB, BOJ, BOK, HKMA, OECD, IMF, EUROSTAT, BIS, USTREASURY, WORLDBANK]
          - relationships:
              to: ref('dim_data_provider')
              field: provider_code
      - name: series_id
        description: "Series identifier in the provider's namespace."
        tests:
          - not_null
      - name: observation_date
        description: "Observation date (DATE). First day of period for monthly/quarterly/annual series."
        tests:
          - not_null
      - name: value
        description: "Observed numeric value. NOT NULL — null-valued source rows filtered upstream."
        tests:
          - not_null
      - name: unit
        description: "Unit of measurement as published by the provider."
      - name: frequency
        description: "Reporting frequency ('daily','monthly','quarterly','annual'). NULL when unknown."
      - name: country_iso3
        description: "ISO 3166-1 alpha-3 country code. NULL for aggregates."
      - name: record_source
        description: "Lineage string from the upstream satellite."
        tests:
          - not_null
      - name: is_dev_dataset
        description: "TRUE if data originated from a development/test seed. Always FALSE here."
        tests:
          - not_null
      - name: load_ts
        description: "UTC ingestion timestamp from the upstream satellite (active SCD2 row)."
        tests:
          - not_null

  # ── fact_crypto_consensus_3way ─────────────────────────────────────────────
  - name: fact_crypto_consensus_3way
    description: >
      3-way crypto consensus across CoinGecko + CoinPaprika + CryptoCompare daily snapshots.
      For each (symbol, snapshot_date), aggregates non-null price_usd from each provider:
        - sources_count        — number of providers reporting (1, 2 or 3)
        - consensus_price_usd  — AVG across non-null sources
        - std_deviation        — STDDEV_SAMP (NULL when sources_count < 2)
        - max_deviation_pct    — (max - min) / consensus, relative price spread
        - is_robust_consensus  — TRUE if sources_count >= 2
      Disclaimer: Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public_recomputed
        ai_generated: false
        disclaimer: "Not financial advice. Methodology disclosed."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, snapshot_date]
    columns:
      - name: symbol
        description: "Uppercased token symbol (e.g. 'BTC', 'ETH', 'USDT')."
        tests:
          - not_null
      - name: snapshot_date
        description: "UTC calendar date of the snapshot."
        tests:
          - not_null
      - name: price_coingecko
        description: "USD spot price from CoinGecko snapshot. NULL if symbol absent."
      - name: price_paprika
        description: "USD spot price from CoinPaprika snapshot. NULL if symbol absent."
      - name: price_cryptocompare
        description: "USD spot price from CryptoCompare snapshot. NULL if symbol absent."
      - name: sources_count
        description: "Number of providers (1, 2 or 3) reporting a non-null price."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
      - name: consensus_price_usd
        description: "Arithmetic mean of available provider prices."
      - name: std_deviation
        description: "Sample standard deviation. NULL when sources_count < 2."
      - name: max_deviation_pct
        description: "Relative spread: (max - min) / consensus. NULL when sources_count < 2."
      - name: is_robust_consensus
        description: "TRUE when at least 2 providers concur (sources_count >= 2)."
        tests:
          - not_null

  # ── fact_legal_entity_enriched ─────────────────────────────────────────────
  - name: fact_legal_entity_enriched
    description: >
      Cross-reference enriched view for assets, exposing LEI, FIGI family
      (figi/composite_figi/share_class_figi/bbg_ticker), ISIN, CUSIP, SEDOL, WKN,
      SIREN (French INSEE), UK Companies House number, and GLEIF legal entity
      descriptive attributes (legal_name, jurisdiction, legal_form, hierarchy).
      Permits lookup of an asset by any single identifier.
      identifier_count signals cross-reference density (0..8).
      Disclaimer: Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        ai_generated: false
        disclaimer: "Not financial advice. Methodology disclosed."
    columns:
      - name: asset_hk
        description: "Hub asset hash key (PK of hub_asset). Anchor for all crosswalks."
        tests:
          - unique
          - not_null
          - relationships:
              to: source('dv', 'hub_asset')
              field: asset_hk
      - name: identifier
        description: "Native business identifier from hub_asset."
        tests:
          - not_null
      - name: asset_kind
        description: "Asset kind: stock | etf | crypto | macro."
        tests:
          - not_null
          - accepted_values:
              values: ['stock', 'etf', 'crypto', 'macro']
      - name: lei
        description: "ISO 17442 Legal Entity Identifier from GLEIF (NULL if no LEI mapped)."
      - name: lei_legal_name
        description: "Legal name from GLEIF sat_legal_entity (active row)."
      - name: lei_jurisdiction
        description: "ISO 3166-2 jurisdiction code from GLEIF."
      - name: lei_legal_form_code
        description: "ELF (Entity Legal Form) code from GLEIF."
      - name: lei_entity_status
        description: "GLEIF entity_status — ACTIVE | INACTIVE | LAPSED."
        tests:
          - accepted_values:
              values: ['ACTIVE', 'INACTIVE', 'LAPSED']
              config:
                where: "lei_entity_status is not null"
      - name: ultimate_parent_lei
        description: "GLEIF ultimate parent LEI."
      - name: direct_parent_lei
        description: "GLEIF direct parent LEI."
      - name: lei_relationship_type
        description: "link_asset_legal_entity.relationship_type ('issuer' preferred)."
      - name: figi
        description: "Bloomberg FIGI (12-char instrument identifier)."
      - name: composite_figi
        description: "Composite FIGI (country/primary listing)."
      - name: share_class_figi
        description: "Share Class FIGI (across all listings of the share class)."
      - name: bbg_ticker
        description: "Bloomberg ticker (e.g. 'AAPL US Equity')."
      - name: figi_exchange_code
        description: "OpenFIGI exchCode (e.g. 'US', 'GR', 'LN')."
      - name: figi_market_sector
        description: "OpenFIGI marketSector ('Equity', 'Comdty', 'Curncy', 'Corp')."
      - name: figi_security_type
        description: "OpenFIGI securityType."
      - name: isin
        description: "ISO 6166 International Securities Identification Number (coalesced from FIGI)."
      - name: cusip
        description: "CUSIP — US/Canada securities identifier."
      - name: sedol
        description: "SEDOL — UK/Ireland securities identifier."
      - name: wkn
        description: "Wertpapierkennnummer — German securities identifier."
      - name: siren
        description: "INSEE SIREN — 9-digit French legal entity identifier."
      - name: siret_siege
        description: "SIRET du siège social — SIREN(9) + NIC(5)."
      - name: sirene_legal_name
        description: "Dénomination de l'unité légale from INSEE SIRENE."
      - name: sirene_legal_form_code
        description: "Catégorie juridique INSEE."
      - name: sirene_naf_code
        description: "Code NAF/APE activité principale."
      - name: uk_company_number
        description: "UK Companies House registration number."
      - name: uk_company_name
        description: "Registered company name at UK Companies House."
      - name: uk_company_type
        description: "UK company type ('plc', 'ltd', 'llp')."
      - name: uk_company_status
        description: "UK company status ('active', 'liquidation', 'dissolved')."
      - name: uk_sic_codes
        description: "UK SIC (Standard Industrial Classification) codes — text[]."
      - name: identifier_count
        description: >
          Count of populated cross-reference identifiers (0..8):
          lei + figi + isin + cusip + sedol + wkn + siren + uk_company_number.
        tests:
          - not_null
