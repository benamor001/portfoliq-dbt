version: 2

# =============================================================================
# portfoliq — sources.yml subset
#
# This file declares the upstream Data Vault (dv) and staging objects required
# by the 3 facts shipped in this package. The user is expected to have these
# tables/views populated in their local DB — either by replicating the public
# portfolIQ replica or by running the parent dbt project to materialize them.
#
# Schema is parameterized by var('portfoliq_dv_schema') (default 'dv').
# =============================================================================

sources:
  # ── Data Vault layer (hubs / links / satellites) ───────────────────────────
  - name: dv
    description: >
      portfolIQ Data Vault 2.0 layer. Contains hubs, links and satellites for
      all tracked entities (asset, legal entity, macro series, crypto snapshots).
      Each satellite is SCD2 — readers must filter on load_end_ts IS NULL.
    schema: "{{ var('portfoliq_dv_schema', 'dv') }}"
    tables:

      # ── Hubs ─────────────────────────────────────────────────────────────
      - name: hub_asset
        description: "Hub for assets (stocks, ETFs, cryptos, macro series). PK = asset_hk."
        columns:
          - name: asset_hk
            description: "Hash key of the business identifier."
          - name: identifier
            description: "Native business identifier (ticker, coingecko_id, series_key)."
          - name: asset_kind
            description: "Asset kind: stock | etf | crypto | macro."

      - name: hub_legal_entity
        description: "Hub for legal entities (issuers, sponsors). PK = legal_entity_hk."
        columns:
          - name: legal_entity_hk
            description: "Hash key derived from LEI."
          - name: lei
            description: "ISO 17442 Legal Entity Identifier."

      # ── Links ────────────────────────────────────────────────────────────
      - name: link_asset_legal_entity
        description: "Link between asset and its legal entity (issuer/sponsor/custodian)."
        columns:
          - name: asset_hk
          - name: legal_entity_hk
          - name: relationship_type
            description: "issuer | sponsor | custodian | other."
          - name: load_ts

      # ── Satellites — Asset identifier crosswalks ─────────────────────────
      - name: sat_asset_figi
        description: "Bloomberg FIGI family identifiers (FIGI, ISIN, CUSIP, SEDOL, WKN, bbg_ticker)."
        loaded_at_field: load_ts
        freshness:
          warn_after: { count: 30, period: day }
        columns:
          - name: asset_hk
          - name: figi
          - name: composite_figi
          - name: share_class_figi
          - name: bbg_ticker
          - name: exchange_code
          - name: market_sector
          - name: security_type
          - name: isin
          - name: cusip
          - name: sedol
          - name: wkn
          - name: load_ts
          - name: load_end_ts

      - name: sat_asset_sirene
        description: "INSEE SIRENE — French entities (SIREN, SIRET siege, NAF code)."
        columns:
          - name: asset_hk
          - name: siren
          - name: siret_siege
          - name: denomination_unite_legale
          - name: categorie_juridique
          - name: activite_principale_naf
          - name: load_ts
          - name: load_end_ts

      - name: sat_asset_companies_house
        description: "UK Companies House registry (company_number, status, SIC codes)."
        columns:
          - name: asset_hk
          - name: company_number
          - name: company_name
          - name: company_type
          - name: company_status
          - name: sic_codes
          - name: load_ts
          - name: load_end_ts

      - name: sat_legal_entity
        description: "GLEIF descriptive attributes for legal entities."
        columns:
          - name: legal_entity_hk
          - name: legal_name
          - name: legal_jurisdiction
          - name: legal_form_code
          - name: entity_status
          - name: ultimate_parent_lei
          - name: direct_parent_lei
          - name: load_ts
          - name: load_end_ts

      # ── Satellites — Crypto snapshots ────────────────────────────────────
      - name: sat_crypto_paprika_snapshot
        description: "Daily CoinPaprika snapshot — paprika_id, price_usd, snapshot_date."
        loaded_at_field: load_ts
        freshness:
          warn_after: { count: 2, period: day }
          error_after: { count: 7, period: day }
        columns:
          - name: paprika_id
          - name: snapshot_date
          - name: price_usd
          - name: load_ts
          - name: load_end_ts

      - name: sat_crypto_cryptocompare_snapshot
        description: "Daily CryptoCompare snapshot — symbol, price_usd, snapshot_date."
        loaded_at_field: load_ts
        freshness:
          warn_after: { count: 2, period: day }
          error_after: { count: 7, period: day }
        columns:
          - name: symbol
          - name: snapshot_date
          - name: price_usd
          - name: load_ts
          - name: load_end_ts

      # ── Satellites — Macro series (per provider) ─────────────────────────
      - name: sat_macro_ecb_observation
        description: "ECB Statistical Data Warehouse observations."
        columns:
          - name: series_id
          - name: observation_date
          - name: value
          - name: unit
          - name: frequency
          - name: country_iso2
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      - name: sat_macro_boj_observation
        description: "Bank of Japan time-series observations."
        columns:
          - name: series_id
          - name: observation_date
          - name: value
          - name: unit
          - name: frequency
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      - name: sat_macro_bok
        description: "Bank of Korea ECOS observations."
        columns:
          - name: series_id
          - name: observation_date
          - name: value
          - name: unit
          - name: frequency
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      - name: sat_macro_hkma
        description: "Hong Kong Monetary Authority observations."
        columns:
          - name: series_id
          - name: observation_date
          - name: value
          - name: unit
          - name: frequency
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      - name: sat_macro_oecd
        description: "OECD Statistics observations (mixed-granularity observation_period strings)."
        columns:
          - name: dataset_code
          - name: indicator_code
          - name: observation_period
          - name: value
          - name: unit
          - name: country_iso3
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      - name: sat_macro_imf
        description: "IMF DataMapper observations."
        columns:
          - name: dataset_code
          - name: indicator_code
          - name: observation_period
          - name: value
          - name: unit
          - name: country_iso3
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      - name: sat_macro_eurostat
        description: "Eurostat observations (with geo_code)."
        columns:
          - name: dataset_code
          - name: observation_period
          - name: value
          - name: unit
          - name: geo_code
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      - name: sat_macro_bis
        description: "Bank for International Settlements observations."
        columns:
          - name: dataset_code
          - name: series_key
          - name: observation_period
          - name: value
          - name: unit
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      - name: sat_macro_us_treasury
        description: "US Treasury Fiscal Data API observations."
        columns:
          - name: dataset_code
          - name: series_id
          - name: observation_date
          - name: value
          - name: unit
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      - name: sat_macro_worldbank
        description: "World Bank Open Data indicators (annual)."
        columns:
          - name: indicator_code
          - name: observation_year
          - name: value
          - name: unit
          - name: country_iso2
          - name: record_source
          - name: load_ts
          - name: load_end_ts

      # ── Staging passthrough (lives in dv schema in the parent project) ──
      # CoinGecko market staging: materialised as a view in the dv schema by the
      # parent finance_data_api project. We surface it here as a source so the
      # package does not need to recompute it (and avoids requiring the user to
      # host the raw.coingecko_market_snapshot table).
      - name: stg_coingecko_market
        description: >
          CoinGecko market snapshots, typed. Exposes columns: coingecko_id,
          symbol, current_price_usd, load_ts. Maintained by the parent project.
        columns:
          - name: coingecko_id
          - name: symbol
          - name: current_price_usd
          - name: load_ts

  # ── Raw layer — for FRED observations only (it lives in raw schema upstream) ─
  - name: raw
    description: >
      portfolIQ raw landing schema. We only depend on fred_observations here —
      FRED is a single-table staging by design (no satellite split).
    schema: raw
    tables:
      - name: fred_observations
        description: "Raw FRED API observations (commodity + macro)."
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 2, period: day }
        columns:
          - name: series_id
          - name: observation_date
          - name: value
          - name: value_unit
          - name: frequency
          - name: record_source
          - name: ingested_at
