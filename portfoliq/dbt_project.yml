# =============================================================================
# portfoliq — dbt package (data engineer pack)
#
# Sprint 90 Lane B — extraction packageable du subset Sprint 89 Lane B marts:
#   - 3 facts:  fact_macro_observations_unified, fact_crypto_consensus_3way,
#               fact_legal_entity_enriched
#   - 2 dims:   dim_data_provider, dim_data_license (seeds)
#
# Distribution: standalone dbt package, installable via packages.yml git url
#               or (future) dbt Hub.
#
# Schema strategy:
#   - Sources read from portfoliq_dv_schema (default 'dv') — overridable.
#   - Marts materialize in portfoliq_marts_schema (default 'marts') — overridable.
#   - Users running the package against a local copy of the portfolIQ DB just
#     need a profile pointed at the right schemas.
#
# Tests:
#   - Default severity: warn (allows adoption without breaking host project CI).
#   - User can override per-project via `tests: portfoliq: +severity: error`.
#
# Legal: data sourced from open providers (FRED, ECB, CoinGecko, etc.). See
#        dim_data_license + dim_data_provider seeds for attribution constraints.
# Disclaimer: Not financial advice. Methodology disclosed.
# =============================================================================

name: 'portfoliq'
version: '0.1.0'
config-version: 2

profile: 'portfoliq'

model-paths:    ['models']
seed-paths:     ['seeds']
macro-paths:    ['macros']
analysis-paths: ['analyses']
test-paths:     ['tests']

clean-targets:
  - target
  - dbt_packages

require-dbt-version: ">=1.7.0"

# ──────────────────────────────────────────────────────────────────────────────
# Variables — schema overrides + feature toggles
# ──────────────────────────────────────────────────────────────────────────────
vars:
  # Schema where the source Data Vault (dv) tables live in the user's DB.
  # Override in your project's dbt_project.yml if your local copy uses a different
  # schema (e.g. when materialising the portfolIQ replica into 'public' or 'piq').
  portfoliq_dv_schema: 'dv'

  # Schema where this package's marts (facts + dimensions) materialize.
  portfoliq_marts_schema: 'marts'

  # Enable / disable individual fact families. Default: all on.
  # Set to false to skip downstream tests + materialization.
  portfoliq_enable_macro: true
  portfoliq_enable_crypto: true
  portfoliq_enable_legal_entity: true

# ──────────────────────────────────────────────────────────────────────────────
# Model configuration
# ──────────────────────────────────────────────────────────────────────────────
models:
  portfoliq:
    +materialized: view
    +tags: ['portfoliq']

    marts:
      +schema: "{{ var('portfoliq_marts_schema', 'marts') }}"
      facts:
        +tags: ['portfoliq', 'fact']

# ──────────────────────────────────────────────────────────────────────────────
# Seed configuration
# ──────────────────────────────────────────────────────────────────────────────
seeds:
  portfoliq:
    +schema: "{{ var('portfoliq_marts_schema', 'marts') }}"
    +tags: ['portfoliq', 'seed']

    dim_data_provider:
      +column_types:
        provider_code:           text
        provider_name:           text
        category:                text
        license_code:            text
        license_url:             text
        attribution_required:    boolean
        redistribution_allowed:  boolean
        attribution_text:        text
        is_active:               boolean

    dim_data_license:
      +column_types:
        license_code:             text
        license_name:             text
        license_family:           text
        license_url:              text
        is_open_data:             boolean
        redistribution_allowed:   boolean
        commercial_use_allowed:   boolean
        attribution_required:     boolean
        share_alike:              boolean
        notes:                    text

# ──────────────────────────────────────────────────────────────────────────────
# Test configuration
# Default severity: warn — does not break the host project's CI on first install.
# Override in your dbt_project.yml to enforce errors:
#   tests:
#     portfoliq:
#       +severity: error
# ──────────────────────────────────────────────────────────────────────────────
tests:
  portfoliq:
    +severity: warn
