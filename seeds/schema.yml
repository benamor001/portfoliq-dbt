version: 2

# =============================================================================
# seeds/schema.yml — portfoliq dbt pack
# Static reference seeds bundled with the pack.
# These seeds are the canonical source for blockchain, event type, analysis type
# and tier reference data. They match the portfolIQ internal pipeline seeds.
#
# Legal: Not financial advice. Methodology disclosed.
# Licence: ELv2 — see NOTICE.md
# =============================================================================

seeds:
  - name: dim_chain
    description: >
      Static dimension — blockchain / network reference table (~30 chains).
      Includes all major L1s and Ethereum L2s tracked by portfolIQ.
      is_l2=true always implies parent_chain_id IS NOT NULL.
      Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        public_doc: true
    columns:
      - name: chain_id
        description: >
          Stable slug identifier (e.g. 'ethereum', 'arbitrum', 'bitcoin').
          Primary key — never changes once allocated.
        tests:
          - unique
          - not_null

      - name: chain_name
        description: "Human-readable chain name (e.g. 'Ethereum', 'Arbitrum One')."
        tests:
          - not_null

      - name: native_symbol
        description: "Native gas token ticker (e.g. 'ETH', 'BNB', 'BTC')."
        tests:
          - not_null

      - name: is_evm
        description: "True if the chain is EVM-compatible (Solidity/EVM bytecode)."
        tests:
          - not_null

      - name: is_l2
        description: "True if the chain is a Layer 2 network built on a parent chain."
        tests:
          - not_null

      - name: parent_chain_id
        description: >
          FK to chain_id of the parent L1. NULL for standalone L1 chains.
          If is_l2=true, parent_chain_id MUST NOT be NULL.

  - name: dim_event_type
    description: >
      Static dimension — crypto event type reference table (18 event types).
      Covers market-moving and protocol events.
      affects_price_typically is indicative only — NOT investment advice.
      Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        public_doc: true
    columns:
      - name: event_type_id
        description: >
          Stable slug identifier (e.g. 'halving', 'hard_fork', 'exchange_listing').
          Primary key — never changes once allocated.
        tests:
          - unique
          - not_null

      - name: event_type_label
        description: "Human-readable label (e.g. 'Halving', 'Hard Fork')."
        tests:
          - not_null

      - name: description
        description: "Brief description of the event type and its typical significance."

      - name: affects_price_typically
        description: >
          Indicative boolean — true if this event type historically correlates
          with significant price movements. This is NOT investment advice.
          Based on general market observation, not financial modeling.
        tests:
          - not_null

  - name: dim_analysis_type
    description: >
      Static dimension — AI analysis type reference table (11 rows).
      Aligned with portfolIQ prompts/registry.yml.
      is_enabled=false for halal_screening and reserved_* types.
      model_default and refresh_cadence are NULL for disabled types.
      Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        public_doc: true
    columns:
      - name: analysis_type_id
        description: >
          Stable slug identifier aligned with portfolIQ prompts/registry.yml
          (e.g. 'token_classification', 'news_summary').
          Primary key — never changes once allocated.
        tests:
          - unique
          - not_null

      - name: analysis_type_label
        description: "Human-readable label (e.g. 'Token Classification', 'News Summary')."
        tests:
          - not_null

      - name: model_default
        description: >
          Default Claude model for this analysis type (e.g. 'claude-haiku-4-5').
          NULL when is_enabled=false.

      - name: refresh_cadence
        description: >
          Refresh trigger cadence for this analysis type.
          Values: quarterly_or_event, monthly_or_event, trigger_new_news,
          trigger_price_move, on_event. NULL when is_enabled=false.

      - name: is_enabled
        description: >
          True if this analysis type is active in production.
          False for halal_screening (not in scope v1) and reserved_* placeholders.
        tests:
          - not_null

  - name: dim_tier
    description: >
      Static dimension — crypto asset market cap tier reference table (3 rows).
      Tier boundary is always market_cap_rank — NOT a fixed USD threshold.
      min_market_cap_usd_approx is indicative and manually updated.
      Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        public_doc: true
    columns:
      - name: tier
        description: "Tier integer PK: 1=Top50, 2=Top51-200, 3=Top201-1000."
        tests:
          - unique
          - not_null

      - name: tier_label
        description: "Human-readable label (e.g. 'Tier 1 (Top 50)')."
        tests:
          - not_null

      - name: min_rank
        description: "Minimum market cap rank (inclusive) for this tier."
        tests:
          - not_null

      - name: max_rank
        description: "Maximum market cap rank (inclusive) for this tier."
        tests:
          - not_null

      - name: min_market_cap_usd_approx
        description: >
          Approximate minimum market cap in USD for this tier.
          Indicative only — manually updated. NOT a contractual threshold.
          The actual tier assignment uses market_cap_rank, not this value.

  # ===========================================================================
  # Demo seeds — synthetic data for local DuckDB development and CI smoke tests.
  #
  # LEGAL DISCLAIMER (portfolIQ §5.3):
  #   Seed data is synthetic — not real market prices. Values are generated for
  #   testing purposes only. Not financial advice. Not real market data.
  #   "Synthetic for testing purposes" — do not use in production or for any
  #   financial decision-making.
  #
  # These seeds are tagged 'demo' and intended for use with the duckdb_dev
  # profile: `dbt seed --target duckdb_dev --select tag:demo`
  # Contractual file names (used by T-689 CI matrix): demo_assets.csv,
  # demo_market_snapshots.csv. Do not rename.
  # ===========================================================================

  - name: demo_assets
    description: >
      SYNTHETIC demo seed — 10 representative assets (crypto + ETF stubs).
      All values are fictitious and generated for testing purposes only.
      Not real market data. Not financial advice. Methodology disclosed.
      Tag: demo. Used by duckdb_dev target.
    config:
      tags: ['demo']
      meta:
        exposure: internal
        synthetic: true
        legal_notice: "Synthetic for testing purposes — not real market data."
    columns:
      - name: asset_sk
        description: "Surrogate key (integer). PK for demo seed."
        tests:
          - unique
          - not_null
      - name: asset_id
        description: "Stable slug identifier (e.g. 'btc', 'eth', 'msci_world_etf')."
        tests:
          - unique
          - not_null
      - name: ticker
        description: "Trading ticker symbol (e.g. 'BTC', 'ETH'). Synthetic."
        tests:
          - not_null
      - name: name
        description: "Human-readable asset name. Synthetic."
        tests:
          - not_null
      - name: tier
        description: "Market cap tier (1=Top50, 2=Top51-200). Synthetic classification."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
      - name: contract_address
        description: "ERC-20 contract address for on-chain assets. Empty for non-EVM assets."
      - name: sources_confirmed
        description: "Number of data sources that confirmed this asset. Synthetic integer."
        tests:
          - not_null
      - name: single_source
        description: "True if only one source confirms this asset. False = multi-source."
        tests:
          - not_null
      - name: methodology_version
        description: "portfolIQ methodology version string (e.g. 'v1'). Synthetic."
        tests:
          - not_null
      - name: valid_from
        description: "SCD2 validity start date. Synthetic (fixed 2024-01-01 for demo)."
        tests:
          - not_null
      - name: valid_to
        description: "SCD2 validity end date. NULL = current record. Synthetic."
      - name: is_current
        description: "SCD2 current record flag. All demo records are current."
        tests:
          - not_null

  - name: demo_market_snapshots
    description: >
      SYNTHETIC demo seed — 300 rows (10 assets x 30 daily snapshots, Jan 2024).
      All price values are fictitious. Generated with a deterministic drift formula
      for testing purposes only. Not real market data. Not financial advice.
      Methodology disclosed.
      Tag: demo. Used by duckdb_dev target.
    config:
      tags: ['demo']
      meta:
        exposure: internal
        synthetic: true
        legal_notice: "Synthetic for testing purposes — not real market prices."
    columns:
      - name: asset_sk
        description: "FK to demo_assets.asset_sk."
        tests:
          - not_null
          - relationships:
              to: ref('demo_assets')
              field: asset_sk
      - name: asset_id
        description: "Asset slug identifier. Synthetic."
        tests:
          - not_null
      - name: snapshot_date
        description: "Daily snapshot date (YYYY-MM-DD). Covers 2024-01-01 to 2024-01-30. Synthetic."
        tests:
          - not_null
      - name: date_key
        description: "Integer date key (YYYYMMDD). Synthetic."
        tests:
          - not_null
      - name: price_consensus_usd
        description: >
          SYNTHETIC price in USD. Not a real market price. Generated with a
          deterministic drift formula for testing purposes only.
          Not financial advice. Do not use for production or financial decisions.
        tests:
          - not_null
      - name: supply_on_chain
        description: "Approximate on-chain circulating supply. Synthetic. 0 for ETF stubs."
        tests:
          - not_null
      - name: market_cap_derived_usd
        description: "Derived market cap = price * supply. Synthetic. 0 for ETF stubs."
        tests:
          - not_null
      - name: tier_crypto
        description: "Tier classification for crypto assets. Synthetic."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3]
      - name: exchanges_count
        description: "Number of exchanges covering this asset. Synthetic."
        tests:
          - not_null
      - name: methodology_version
        description: "portfolIQ methodology version string. Synthetic."
        tests:
          - not_null
