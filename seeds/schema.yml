version: 2

# =============================================================================
# seeds/schema.yml — portfoliq dbt pack
# Static reference seeds bundled with the pack.
# These seeds are the canonical source for blockchain, event type, analysis type
# and tier reference data. They match the portfolIQ internal pipeline seeds.
#
# Legal: Not financial advice. Methodology disclosed.
# Licence: ELv2 — see NOTICE.md
# =============================================================================

seeds:
  - name: dim_chain
    description: >
      Static dimension — blockchain / network reference table (~30 chains).
      Includes all major L1s and Ethereum L2s tracked by portfolIQ.
      is_l2=true always implies parent_chain_id IS NOT NULL.
      Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        public_doc: true
    columns:
      - name: chain_id
        description: >
          Stable slug identifier (e.g. 'ethereum', 'arbitrum', 'bitcoin').
          Primary key — never changes once allocated.
        tests:
          - unique
          - not_null

      - name: chain_name
        description: "Human-readable chain name (e.g. 'Ethereum', 'Arbitrum One')."
        tests:
          - not_null

      - name: native_symbol
        description: "Native gas token ticker (e.g. 'ETH', 'BNB', 'BTC')."
        tests:
          - not_null

      - name: is_evm
        description: "True if the chain is EVM-compatible (Solidity/EVM bytecode)."
        tests:
          - not_null

      - name: is_l2
        description: "True if the chain is a Layer 2 network built on a parent chain."
        tests:
          - not_null

      - name: parent_chain_id
        description: >
          FK to chain_id of the parent L1. NULL for standalone L1 chains.
          If is_l2=true, parent_chain_id MUST NOT be NULL.

  - name: dim_event_type
    description: >
      Static dimension — crypto event type reference table (18 event types).
      Covers market-moving and protocol events.
      affects_price_typically is indicative only — NOT investment advice.
      Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        public_doc: true
    columns:
      - name: event_type_id
        description: >
          Stable slug identifier (e.g. 'halving', 'hard_fork', 'exchange_listing').
          Primary key — never changes once allocated.
        tests:
          - unique
          - not_null

      - name: event_type_label
        description: "Human-readable label (e.g. 'Halving', 'Hard Fork')."
        tests:
          - not_null

      - name: description
        description: "Brief description of the event type and its typical significance."

      - name: affects_price_typically
        description: >
          Indicative boolean — true if this event type historically correlates
          with significant price movements. This is NOT investment advice.
          Based on general market observation, not financial modeling.
        tests:
          - not_null

  - name: dim_analysis_type
    description: >
      Static dimension — AI analysis type reference table (11 rows).
      Aligned with portfolIQ prompts/registry.yml.
      is_enabled=false for halal_screening and reserved_* types.
      model_default and refresh_cadence are NULL for disabled types.
      Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        public_doc: true
    columns:
      - name: analysis_type_id
        description: >
          Stable slug identifier aligned with portfolIQ prompts/registry.yml
          (e.g. 'token_classification', 'news_summary').
          Primary key — never changes once allocated.
        tests:
          - unique
          - not_null

      - name: analysis_type_label
        description: "Human-readable label (e.g. 'Token Classification', 'News Summary')."
        tests:
          - not_null

      - name: model_default
        description: >
          Default Claude model for this analysis type (e.g. 'claude-haiku-4-5').
          NULL when is_enabled=false.

      - name: refresh_cadence
        description: >
          Refresh trigger cadence for this analysis type.
          Values: quarterly_or_event, monthly_or_event, trigger_new_news,
          trigger_price_move, on_event. NULL when is_enabled=false.

      - name: is_enabled
        description: >
          True if this analysis type is active in production.
          False for halal_screening (not in scope v1) and reserved_* placeholders.
        tests:
          - not_null

  - name: dim_tier
    description: >
      Static dimension — crypto asset market cap tier reference table (3 rows).
      Tier boundary is always market_cap_rank — NOT a fixed USD threshold.
      min_market_cap_usd_approx is indicative and manually updated.
      Not financial advice. Methodology disclosed.
    config:
      meta:
        exposure: public
        public_doc: true
    columns:
      - name: tier
        description: "Tier integer PK: 1=Top50, 2=Top51-200, 3=Top201-1000."
        tests:
          - unique
          - not_null

      - name: tier_label
        description: "Human-readable label (e.g. 'Tier 1 (Top 50)')."
        tests:
          - not_null

      - name: min_rank
        description: "Minimum market cap rank (inclusive) for this tier."
        tests:
          - not_null

      - name: max_rank
        description: "Maximum market cap rank (inclusive) for this tier."
        tests:
          - not_null

      - name: min_market_cap_usd_approx
        description: >
          Approximate minimum market cap in USD for this tier.
          Indicative only — manually updated. NOT a contractual threshold.
          The actual tier assignment uses market_cap_rank, not this value.
