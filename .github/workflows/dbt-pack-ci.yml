name: dbt pack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt + DuckDB adapter
        run: pip install dbt-core dbt-duckdb

      - name: dbt deps + dbt parse (blank consumer project)
        run: make ci
